name: Create Nightly Package

on:
  create:

jobs:
  is_nightly:
    if: contains(github.ref, 'nightly') == true
    runs-on: ubuntu-latest

    steps:
      - name: Check
        run: echo ${{ github.ref }}

  package:
    needs: is_nightly
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove Changelog
        run: rm -f CHANGELOG.md

      # Releases bundle the Aurora tag pinned in .pkgmeta. A nightly takes the
      # newest Aurora tag instead: its nightly when that is newer than its last
      # release. Only this job's checkout is rewritten.
      - name: Nightly takes the newest Aurora tag
        run: |
          sed -i '/RealUI_Skins\/Aurora:/,/tag:/ s/tag: .*/tag: latest/' .pkgmeta

      # See package_release.yml: the action cannot detect our svn externals.
      - name: Install subversion
        run: sudo apt-get install -yq subversion

      # -L skips the CurseForge upload; the nightly is a GitHub pre-release only.
      - name: Create Nightly Package
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -L -p 1658899
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark as pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF#refs/tags/}" --prerelease --repo "$GITHUB_REPOSITORY"
